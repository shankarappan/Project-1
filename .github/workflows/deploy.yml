name: Deploy Lets Split

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vercel from GitHub main
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is not configured. Skipping deploy."
            echo "Add it at: https://github.com/shankarappan/Project-1/settings/secrets/actions"
            exit 0
          fi

          curl -fsS -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "lets-split",
              "project": "prj_D0P5T7WOsv6cb7cnOER3NDnWZ010",
              "target": "production",
              "gitSource": {
                "type": "github",
                "repoId": 1194744247,
                "ref": "main"
              }
            }'
